[package]
name = "xero-howdy-qt"
version = "0.1.0"
edition = "2021"
description = "Qt GUI for howdy face recognition"
authors = ["xero"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = "0.7"

[[bin]]
name = "xero-howdy-qt"
path = "src/main.rs"
